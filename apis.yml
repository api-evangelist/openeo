aid: openeo

name: openEO

description: openEO develops an open application programming interface (API) that connects clients like R, Python and JavaScript to big Earth
  observation (EO) cloud back-ends in a simple and unified way, so each client can work with every back-end and back-ends can be compared on capacity,
  cost and results. The openEO API specification, process definitions, client libraries (Python, R, JavaScript, Julia, QGIS plugin) and web editor
  are open source under Apache 2.0, governed by a Project Steering Committee, and openEO is recognised as an OGC Community Standard.

