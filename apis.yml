- aid: openeo:openeo-eo-data-discovery-api
  name: openEO EO Data Discovery API
  description: "These endpoints allow to list the collections that are available at the back-end and can\
    \ be used as data cubes for data processing.\n\n## STAC\n\nFor data discovery of Earth Observation\
    \ Collections at the back-ends, openEO strives for compatibility with the specifications [SpatioTemporal\
    \ Asset Catalog (STAC)](https://stacspec.org/) and [OGC API - Features - Part 1: Core](http://docs.opengeospatial.org/is/17-069r3/17-069r3.html)\
    \ as far as possible. Implementing the data discovery endpoints of openEO also produces valid STAC\
    \ API 1.x and OGC API - Features 1.x responses, including ([partial](#provide-data-for-download))\
    \ compatibility with their APIs. \n\nThe data discovery endpoints `GET /collections` and `GET /collections/{collection_id}`\
    \ are compatible with OGC API - Features and STAC. Both specifications define additional endpoints\
    \ that need to be implemented to be fully compatible. The additional endpoints can easily be integrated\
    \ into an openEO API implementation. A rough list of actions for compatibility is available below,\
    \ but please refer to their specifications to find out the full details.\n\n**Important:** [STAC specification](https://github.com/radiantearth/stac-spec)\
    \ and [STAC API](https://github.com/radiantearth/stac-api-spec) are different specifications and have\
    \ different version numbers.\n\nThe openEO API allows for the\n- STAC versions 1.x.x (RECOMMENDED)\
    \ and 0.9.x (DEPRECATED), and\n- STAC API versions 1.x.x (RECOMMENDED) and 0.9.x (DEPRECATED).\n\n\
    ### Content Extensions\n\nSTAC has several [extensions](https://stac-extensions.github.io) that can\
    \ be used to better describe your data. Clients and server are not required to implement all of them,\
    \ so be aware that some clients may not be able to read all your metadata.\n\nSome commonly used extensions\
    \ that are relevant for datasets exposed through the openEO API are:\n\n- [Classification extension](https://github.com/stac-extensions/classification)\n\
    - [Data Cube extension](https://github.com/stac-extensions/datacube) (part of the openEO API)\n- [EO\
    \ (Electro-Optical) extension](https://github.com/stac-extensions/eo)\n- [Processing extension](https://github.com/stac-extensions/processing)\n\
    - [Projection extension](https://github.com/stac-extensions/projection)\n- [Raster extension](https://github.com/stac-extensions/raster)\n\
    - [SAR extension](https://github.com/stac-extensions/sar)\n- [Satellite extension](https://github.com/stac-extensions/sat)\n\
    - [Scientific Citation extension](https://github.com/stac-extensions/scientific)\n\n### Provide data\
    \ for download\n\nIf you'd like to provide your data for download in addition to offering the cloud\
    \ processing service, you can implement the full STAC API. Therefore, you can implement the endpoints\
    \ `GET /collections/{collection_id}/items` and `GET /collections/{collection_id}/items/{feature_id}`\
    \ to support retrieval of individual items. To benefit from the STAC ecosystem and allow searching\
    \ for items you can also implement `POST /search` and `GET /search`. Further information can be found\
    \ in the [STAC API repository](https://github.com/radiantearth/stac-api-spec).\n\n### API Extensions\n\
    \nSTAC API has several [extensions](https://stac-api-extensions.github.io) that can be implemented\
    \ on top of the openEO API to enrich the API functionality, e.g. for searching."
  humanURL: https://api.openeo.org/
  tags:
  - EO Data Discovery
