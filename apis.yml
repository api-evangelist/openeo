apis:
- aid: openeo:openeo-account-management-api
  name: openEO Account Management API
  description: "The following endpoints handle user profiles, accounting and authentication. See also\
    \ [Authentication](#section/Authentication). In general, the openEO API only defines a minimum subset\
    \ of user management and accounting functionality. It allows to\n\n* [authenticate and authorize](http://www.differencebetween.net/technology/difference-between-authentication-and-authorization/)\
    \ a user, which may include [user registration with OpenID Connect](http://openid.net/specs/openid-connect-registration-1_0.html),\n\
    * handle storage space limits (disk quota),\n* manage billing, which includes to\n    * query the\
    \ credit a user has available,\n    * estimate costs for certain operations (data processing and downloading),\n\
    \    * get information about produced costs,\n    * limit costs of certain operations.\n\nTherefore,\
    \ the API leaves some aspects open that have to be handled by the back-ends separately, including\
    \ \n\n* credentials recovery, e.g. retrieving a forgotten password\n* user data management, e.g. changing\
    \ the users payment details or email address\n* payments, i.e. topping up credits for pre-paid services\
    \ or paying for post-paid services\n* other accounting related tasks, e.g. creating invoices,\n* user\
    \ registration (except for [user registration with OpenID Connect](http://openid.net/specs/openid-connect-registration-1_0.html))."
  humanURL: https://api.openeo.org/
