status: candidate
description: No official openEO MCP server was found. This is a candidate tool list derived one-to-one from the operations of the openEO API v1.3.0 specification and its three draft extensions. openEO is
  a specification implemented by independent back-ends, each at its own base URL, so any server built from this would be configured per back-end.
deployment:
  mode: none
  auth: unknown
  verified: derived
search:
  checked:
  - web search "openEO MCP server model context protocol" (no openEO result)
  - GitHub search "openeo mcp"
  - Open-EO GitHub org repository names (no mcp/agent/llm repo)
  third_party:
  - url: https://github.com/MatMatt/openeo-mcp
    description: Accessing openEO backends via LLMs
    official: false
    note: Community repository found by GitHub search, not in the Open-EO organization; not verified or installed.
auth_note: The spec declares Bearer (token from OIDC or HTTP Basic via /credentials/*) and Basic security schemes.
